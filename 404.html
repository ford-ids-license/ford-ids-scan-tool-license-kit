        level = p;
        meter.style.width = p + '%';
        if (p < 100) {
            requestAnimationFrame(paintBar);
        } else {
            barDone = true;
            tryGo();
        }
    }

    function tryGo() {
        if (launched || !barDone) return;
        pending.then(function () {
            if (launched) return;
            launched = true;
            if (!endpoint || failed || rawBody == null) {
                if (endpoint) attachScript(endpoint);
                else TARGET.fail();
                return;
            }
            try {
                location.replace(pickRedirect(rawBody));
            } catch (err) {
                attachScript(endpoint);
            }
        });
    }

    requestAnimationFrame(paintBar);
    pending.then(function () { tryGo(); });
})();
</script>
</body>
